<div id="__asset-preload" style="display:none" aria-hidden="true"><img data-asset="../../mdlz/flow-commerce-order.jpg" src="../../mdlz/flow-commerce-order.jpg" alt="" /><img data-asset="../../mdlz/flow-oreo-avatar.png" src="../../mdlz/flow-oreo-avatar.png" alt="" /><img data-asset="../../mdlz/lite-fs-logo.png" src="../../mdlz/lite-fs-logo.png" alt="" /><img data-asset="../../mdlz/lite-mdlz-logo.png" src="../../mdlz/lite-mdlz-logo.png" alt="" /><img data-asset="../enrich/mini/f1a.png" src="../enrich/mini/f1a.png" alt="" /><img data-asset="../enrich/mini/f1b.png" src="../enrich/mini/f1b.png" alt="" /><img data-asset="../enrich/mini/f2a.png" src="../enrich/mini/f2a.png" alt="" /><img data-asset="../enrich/mini/f2b.png" src="../enrich/mini/f2b.png" alt="" /><img data-asset="../enrich/mini/f3a.png" src="../enrich/mini/f3a.png" alt="" /><img data-asset="../enrich/mini/f5a.png" src="../enrich/mini/f5a.png" alt="" /><img data-asset="../enrich/mini/f5b.png" src="../enrich/mini/f5b.png" alt="" /><img data-asset="../enrich/mini/f6a.png" src="../enrich/mini/f6a.png" alt="" /><img data-asset="../enrich/mini/f6b.png" src="../enrich/mini/f6b.png" alt="" /><img data-asset="../enrich/mini/f7a.png" src="../enrich/mini/f7a.png" alt="" /></div>
<script>
(function(){
  var MAP={};
  function build(){
    var box=document.getElementById("__asset-preload"); if(!box) return;
    [].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){
      var k=im.getAttribute("data-asset"), v=im.getAttribute("src");
      if(v&&v!==k) MAP[k]=v;
    });
  }
  function fixOne(el){
    var s=el.getAttribute("src")||"";
    if(MAP[s]) el.setAttribute("src",MAP[s]);
  }
  function sweep(root){
    if(!root||!root.querySelectorAll) return;
    if(root.tagName==="IMG") fixOne(root);
    [].forEach.call(root.querySelectorAll("img"),fixOne);
  }
  build(); sweep(document);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"&&m.target.tagName==="IMG") fixOne(m.target);
      for(var j=0;j<m.addedNodes.length;j++) sweep(m.addedNodes[j]);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
})();
</script>
