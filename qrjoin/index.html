<div id="__asset-preload" style="display:none" aria-hidden="true"><img data-asset="../../mdlz/lite-fs-logo.png" src="../../mdlz/lite-fs-logo.png" alt="" /><img data-asset="../../mdlz/lite-mdlz-logo.png" src="../../mdlz/lite-mdlz-logo.png" alt="" /><img data-asset="../../mdlz/mini-shot-qr.png" src="../../mdlz/mini-shot-qr.png" alt="" /><img data-asset="../enrich/mini/f1a.png" src="../enrich/mini/f1a.png" alt="" /><img data-asset="../enrich/mini/f1b.png" src="../enrich/mini/f1b.png" alt="" /><img data-asset="../enrich/mini/f2a.png" src="../enrich/mini/f2a.png" alt="" /><img data-asset="../enrich/mini/f2b.png" src="../enrich/mini/f2b.png" alt="" /><img data-asset="../enrich/mini/f3a.png" src="../enrich/mini/f3a.png" alt="" /><img data-asset="../enrich/mini/f5a.png" src="../enrich/mini/f5a.png" alt="" /><img data-asset="../enrich/mini/f6a.png" src="../enrich/mini/f6a.png" alt="" /><img data-asset="../enrich/mini/f7a.png" src="../enrich/mini/f7a.png" alt="" /></div>
<script>
(function(){
  var MAP={};
  function build(){
    var box=document.getElementById("__asset-preload"); if(!box) return;
    [].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){
      var k=im.getAttribute("data-asset"), v=im.getAttribute("src");
      if(v&&v!==k) MAP[k]=v;
    });
  }
  function fixOne(el){
    var s=el.getAttribute("src")||"";
    if(MAP[s]) el.setAttribute("src",MAP[s]);
  }
  function sweep(root){
    if(!root||!root.querySelectorAll) return;
    if(root.tagName==="IMG") fixOne(root);
    [].forEach.call(root.querySelectorAll("img"),fixOne);
  }
  build(); sweep(document);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"&&m.target.tagName==="IMG") fixOne(m.target);
      for(var j=0;j<m.addedNodes.length;j++) sweep(m.addedNodes[j]);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
})();
</script>

<script>
const MEMBERS=[

const TG={"Pack QR":"#F2E8F9|#4F2170","In-store QR":"#FDF3DC|#8a6d00"};
function tg(t){const[a,b]=TG[t].split("|");return '<span class="tg" style="background:'+a+';color:'+b+'">'+t+'</span>';}
function waHead(){return '<div class="wah"><img src="../../mdlz/lite-mdlz-logo.png"/><div><div class="n">Mondelez India</div><div class="s">✓ Verified business</div></div></div>';}

  :'<div class="usr"><div>'+m[1]+'</div></div>').join("")+'</div>';}

const SCREENS={
 scan:()=>'<img class="full" src="../../mdlz/mini-shot-qr.png"/><div class="scanwrap"><div class="win"></div>'

   ["bot","Consent recorded ✓\nEnrolling you now…"],

   +'<div class="frow" style="animation-delay:0.26s"><div><div class="k">Location</div><div class="v" style="font-size:13px">Phoenix Mall, Mumbai</div></div></div>'
   +'<div class="frow" style="animation-delay:0.34s"><div><div class="k">Consent</div><div class="v" style="font-size:13px">Given 11 Sep 2026</div></div><div class="badge">LOGGED</div></div></div>',
 members:()=>'<div class="mhd"><div class="t">Joy Club members</div><div class="c">56,311</div></div>'
   +'<div class="jcb" style="padding:12px 14px">'+MEMBERS.map((m,i)=>'<div class="mrow" style="animation-delay:'+(i*0.05)+'s"><img src="'+m[1]+'"/><div style="min-width:0"><div class="nm">'+m[0]+'</div><div class="lo">'+m[2]+'</div></div>'+tg(m[3])+'</div>').join("")+'</div>',

const RIGHT={

  +'<div class="card"><div class="hdr">What the QR carries</div>'

  +'<div class="card"><div class="hdr">Where the QR lives</div><div class="chips">'+["Pack back","Gift box seal","Shelf standee","Promoter card","Kiosk poster"].map(c=>'<span class="chip" style="background:#EAF0FB;color:#0A49B7">'+c+'</span>').join("")+'</div></div>',
 ask:()=>'<div><div class="h1">The scan opens WhatsApp</div><div class="sub">Same thread, every brand, every campaign</div></div>'
  +'<div class="card"><div class="hdr">Why WhatsApp</div>'
  +["91% of enriched profiles are WhatsApp-reachable","No download, no password, no drop-off","The thread stays — every future campaign lands here"].map(l=>'<div class="li"><i></i><span>'+l+'</span></div>').join("")+'</div>'
  +'<div class="kpi"><div><div class="v">1</div><div class="l">entry point</div></div><div><div class="v">0</div><div class="l">app installs</div></div><div><div class="v">14</div><div class="l">brands</div></div><div><div class="v">8s</div><div class="l">to enrol</div></div></div>',
