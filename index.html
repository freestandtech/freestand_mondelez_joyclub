<script>
(function(){
  var MAP={};
  function build(){
    var box=document.getElementById("__asset-preload"); if(!box) return;
    [].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){
      var k=im.getAttribute("data-asset"), v=im.getAttribute("src");
      if(v&&v!==k) MAP[k]=v;
    });
  }
  function fixOne(el){
    var s=el.getAttribute("src")||"";
    if(MAP[s]) el.setAttribute("src",MAP[s]);
  }
  function sweep(root){
    if(!root||!root.querySelectorAll) return;
    if(root.tagName==="IMG") fixOne(root);
    [].forEach.call(root.querySelectorAll("img"),fixOne);
  }
  build(); sweep(document);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"&&m.target.tagName==="IMG") fixOne(m.target);
      for(var j=0;j<m.addedNodes.length;j++) sweep(m.addedNodes[j]);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
})();
</script>

function dplayer(S,start){
  const stack=document.getElementById("dstack"); if(!stack)return;
  dpaint=null;
  const spot=document.getElementById("dspot"),modal=document.getElementById("dmodal");
  const tabs=[].slice.call(document.querySelectorAll(".dtab"));
  function place(n){
    const im=stack.children[n], box=stack.getBoundingClientRect();
    const scr=stack.closest(".dscr"), off=scr?box.top-scr.getBoundingClientRect().top:0;
    const ar=(im.naturalWidth&&im.naturalHeight)?im.naturalWidth/im.naturalHeight:1.71;
    const w=box.width, h=Math.min(box.height,w/ar);
    const t=S[n], rw=74*(t.fw||1);
    spot.style.width=rw+"px";
    spot.style.left=Math.round(t.fx*w-rw/2)+"px";
    spot.style.top=Math.round(t.fy*h-37+off)+"px";
  }
  function paint(n){
    [].forEach.call(stack.children,(im,j)=>im.classList.toggle("on",j===n));
    tabs.forEach((b,j)=>b.classList.toggle("on",j===n));
    modal.style.opacity="0";modal.style.transform="translateY(6px)";
    setTimeout(()=>{modal.style.opacity="1";modal.style.transform="none";},40);
    modal.innerHTML='<div class="k">'+S[n].k+'</div><b>'+S[n].t+'</b><p>'+S[n].p+'</p>';
    place(n); setTimeout(()=>place(n),60);
  }
  tabs.forEach(b=>b.onclick=()=>{ const n=+b.dataset.i; location.hash=(n===0?"2":"2."+n); });
  dpaint=paint;
  paint(start||0);
}
