<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FreeStand × Mondelez — Demo Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lexend+Deca:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#052762;--brand2:#0A49B7;--accent:#FA6600;--bg:#EDF1F8;--line:#DDE3EE}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:#1a1a1a}
a{color:var(--brand)}a:hover{color:var(--accent)}
#hub{display:flex;height:100vh;overflow:hidden}
#hub-side{width:290px;flex-shrink:0;background:linear-gradient(180deg,#052762,#0A49B7);color:#fff;display:flex;flex-direction:column;transition:width .22s ease;position:relative}
#hub.collapsed #hub-side{width:56px}
#hub.collapsed .hub-brand{padding:20px 0 16px;align-items:center}
#hub.collapsed .hub-lock{flex-direction:column;gap:8px}
#hub.collapsed .hub-lock .x{display:none}
#hub.collapsed .hub-brand .s,#hub.collapsed #hub-side-list,#hub.collapsed .hub-foot{display:none}
#hub.collapsed .hub-lock img{display:none}
#hub.collapsed .hub-lock img.m{display:block;height:auto;width:34px}
#hub.collapsed .hub-brand{border-bottom-color:rgba(255,255,255,0.1)}
#hub-toggle{position:absolute;top:29px;right:-11px;z-index:5;width:22px;height:22px;border-radius:999px;border:none;background:#fff;color:#052762;box-shadow:0 2px 8px rgba(5,39,98,0.3);cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
#hub-toggle:hover{background:var(--accent);color:#fff}
.hub-brand{padding:24px 20px 18px;display:flex;flex-direction:column;gap:11px;border-bottom:1px solid rgba(255,255,255,0.13)}
.hub-lock{display:flex;align-items:center;gap:11px}
.hub-lock img{height:17px;width:auto;filter:brightness(0) invert(1)}
.hub-lock img.m{height:34px;opacity:0.95}
.hub-lock .x{font-size:11px;opacity:0.38;font-weight:300}
.hub-brand .s{font-size:8.5px;letter-spacing:2.4px;text-transform:uppercase;opacity:0.45;white-space:nowrap}
#hub-side-list{flex:1;overflow-y:auto;padding-bottom:18px}
.hub-group{padding:16px 20px 6px;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;opacity:0.45;font-weight:700}
.hub-item{padding:9px 18px;display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.78);border-left:3px solid transparent;line-height:1.3}
.hub-item:hover{background:rgba(255,255,255,0.06)}
.hub-item.active{background:rgba(255,255,255,0.10);color:#fff;font-weight:700;border-left-color:var(--accent)}
.hub-item .dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.3);flex-shrink:0}
.hub-item.active .dot{background:var(--accent)}
.hub-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.15);font-size:10.5px;line-height:1.6;opacity:0.55}
.hub-foot img{height:20px;filter:brightness(0) invert(1);opacity:0.8;margin-bottom:8px;display:block}
#hub-main{flex:1;display:flex;flex-direction:column;min-width:0}
#hub-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:26px 30px 12px;min-height:0}
.hub-frame{position:relative;width:100%;max-width:1280px;max-height:100%;background:#fff;border-radius:8px;box-shadow:0 18px 50px rgba(5,39,98,0.18);overflow:hidden}
.hub-frame iframe{border:none;display:block}
.hub-embed{width:100%;height:100%;border:none;border-radius:8px;background:#fff;box-shadow:0 18px 50px rgba(5,39,98,0.18)}
.hub-empty{font-size:14px;color:#5a678c;background:#fff;border:1px dashed #B8C4DD;border-radius:10px;padding:40px 60px}
#hub-bar{display:flex;align-items:center;gap:16px;padding:10px 30px 20px;max-width:1340px;width:100%;margin:0 auto}
#hub-bar button{background:var(--brand);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
#hub-bar button:disabled{background:#c3cbdd;cursor:not-allowed}
#hub-counter{font-family:monospace;font-size:12px;color:#5a678c;min-width:64px;text-align:center}
#hub-label{flex:1;font-size:12.5px;color:#43507a;text-align:center;min-height:16px}
</style>
</head>
<body>
<div id="hub">
  <div id="hub-side">
    <button id="hub-toggle" title="Collapse menu">‹</button>
    <div class="hub-brand"><div class="hub-lock"><img src="mdlz/lite-fs-logo.png" alt="FreeStand"/><span class="x">×</span><img class="m" src="mdlz/lite-mdlz-logo.png" alt="Mondelez"/></div><div class="s">Demo of Demos</div></div>
    <div id="hub-side-list"></div>
    <div class="hub-foot">← → keys step through each demo.<br>Pick a demo above to start.</div>
  </div>
  <div id="hub-main">
    <div id="hub-stage"></div>
    <div id="hub-bar">
      <button id="hub-prev">← Previous</button>
      <div id="hub-counter" style="display:none"></div>
      <div id="hub-label"></div>
      <button id="hub-next">Next →</button>
    </div>
  </div>
</div>
<script>(function(){var h=document.getElementById('hub'),b=document.getElementById('hub-toggle');function set(c){h.classList.toggle('collapsed',c);b.textContent=c?'›':'‹';b.title=c?'Expand menu':'Collapse menu';try{localStorage.setItem('mdlzHubSide',c?'1':'0')}catch(e){}}set(localStorage.getItem('mdlzHubSide')==='1');b.addEventListener('click',function(){set(!h.classList.contains('collapsed'))});})();</script>
<script src="mdlz-hub/demos.js?v=2"></script>
<script src="mdlz-hub/hub.js?v=3"></script>
</body>
</html>
