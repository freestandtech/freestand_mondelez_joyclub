<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Enrolment intro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1729;--mut:#6A7794;--line:#E6EAF2;--fs:#0A49B7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1280px;height:832px;overflow:hidden;background:#fff;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
a{color:var(--fs)}a:hover{color:#052762}
#pg{position:relative;width:1280px;height:832px;padding:44px 52px 40px;display:flex;flex-direction:column}
.k{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--brand,#4F2170)}
.k img{height:26px;width:26px;border-radius:999px;object-fit:cover}
h1{margin:14px 0 0;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-1.4px;max-width:960px;text-wrap:pretty}
h1 em{font-style:normal;color:var(--brand,#4F2170)}
.sub{margin:10px 0 0;font-size:14.5px;line-height:1.5;color:var(--mut);max-width:820px}
.grid{flex:1;display:grid;grid-template-columns:392px 1fr;gap:26px;margin-top:26px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.cap{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8E9AB4;margin-bottom:9px}
.shot{flex:1;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#F4F6FA;display:flex;min-height:0;box-shadow:0 14px 34px rgba(13,26,56,.07)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 40%)}
.right{display:flex;flex-direction:column;min-height:0}
.pf{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 14px 34px rgba(13,26,56,.07);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pfh{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid #EEF1F7;background:#FBFCFE}
.pfh img{width:52px;height:52px;border-radius:999px;object-fit:cover;object-position:38% 30%}
.pfh .nm{font-size:17px;font-weight:700;letter-spacing:-.3px}
.pfh .sb{font-size:11.5px;color:var(--mut);margin-top:3px}
.pfh .pill{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#0E7C4A;background:#E7F6EE;border-radius:999px;padding:6px 11px}
.rows{flex:1;overflow:hidden;padding:8px 20px 4px;display:flex;flex-direction:column;justify-content:center}
.rw{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed #EEF1F7}
.rw:last-child{border-bottom:none}
.rw b{font-size:13.5px;font-weight:600}
.rw small{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#9AA6BF}
.rw .tag{font-size:9px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--fs);background:#EEF4FF;border-radius:4px;padding:3px 7px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 20px 16px;border-top:1px solid #EEF1F7;background:#FBFCFE}
.chips span{font-size:11px;font-weight:600;color:#3E4A66;background:#fff;border:1px solid #E3E8F2;border-radius:999px;padding:5px 11px}
.meta{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.mt{border:1px solid var(--line);border-left:3px solid var(--brand,#4F2170);border-radius:12px;padding:13px 16px;background:#FCFDFE}
.mt .cap{margin-bottom:7px}
.mt b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.25px;line-height:1.3}
.mt p{margin:5px 0 0;font-size:11.5px;line-height:1.45;color:var(--mut)}
.foot{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:11px;color:#9AA6BF;letter-spacing:.3px}
.foot img{height:15px;opacity:.75}
</style>
</head><body>

<div id="pg"></div>
<script>window.__introC="cb"</script>

 bv:{brand:"#B4591B",logo:"../../mdlz-hub/strat/dp-bournvita.png",kicker:"Enrolment 1 · Cadbury Bournvita",

const q=window.__introC||new URLSearchParams(location.search).get("c")||"bv";
const d=C[q]||C.bv;
document.getElementById("pg").style.setProperty("--brand",d.brand);
document.getElementById("pg").innerHTML=
 '<div class="k"><img src="'+d.logo+'" alt=""/>'+d.kicker+'</div>'

+'<div class="grid">'
+'<div class="col"><div class="cap">'+d.shotCap+'</div><div class="shot" style="--pos:'+d.pos+'"><img src="'+d.shot+'" alt=""/></div>'

</body></html>
