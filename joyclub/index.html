<div id="__asset-preload" style="display:none" aria-hidden="true"><img data-asset="../../mdlz/lite-fs-logo.png" src="../../mdlz/lite-fs-logo.png" alt="" /><img data-asset="../../mdlz/lite-mdlz-logo.png" src="../../mdlz/lite-mdlz-logo.png" alt="" /><img data-asset="../../mdlz/mini-prod-dairymilk.png" src="../../mdlz/mini-prod-dairymilk.png" alt="" /><img data-asset="../../mdlz/opt/gift-birthday.jpg" src="../../mdlz/opt/gift-birthday.jpg" alt="" /><img data-asset="../../mdlz/opt/prod-biscoff.jpg" src="../../mdlz/opt/prod-biscoff.jpg" alt="" /><img data-asset="../../mdlz/opt/prod-twirl.jpg" src="../../mdlz/opt/prod-twirl.jpg" alt="" /><img data-asset="../../mdlz/opt/recipe-tiffin.jpg" src="../../mdlz/opt/recipe-tiffin.jpg" alt="" /><img data-asset="../../mdlz/opt/srk-ad.jpg" src="../../mdlz/opt/srk-ad.jpg" alt="" /><img data-asset="../../mdlz/opt/ugc-1.jpg" src="../../mdlz/opt/ugc-1.jpg" alt="" /><img data-asset="../../mdlz/opt/ugc-2.jpg" src="../../mdlz/opt/ugc-2.jpg" alt="" /></div>
<script>
(function(){
  var MAP={};
  function build(){
    var box=document.getElementById("__asset-preload"); if(!box) return;
    [].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){
      var k=im.getAttribute("data-asset"), v=im.getAttribute("src");
      if(v&&v!==k) MAP[k]=v;
    });
  }
  function fixOne(el){
    var s=el.getAttribute("src")||"";
    if(MAP[s]) el.setAttribute("src",MAP[s]);
  }
  function sweep(root){
    if(!root||!root.querySelectorAll) return;
    if(root.tagName==="IMG") fixOne(root);
    [].forEach.call(root.querySelectorAll("img"),fixOne);
  }
  build(); sweep(document);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"&&m.target.tagName==="IMG") fixOne(m.target);
      for(var j=0;j<m.addedNodes.length;j++) sweep(m.addedNodes[j]);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
})();
</script>

    .map(r=>'<div style="display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid #EFE9F5;border-radius:10px;margin-bottom:7px"><div style="flex:1;font-size:13.5px;font-weight:500">'+r[0]+'</div><div style="font-size:12.5px;font-weight:700;color:#4F2170">'+r[1]+' pts</div><div style="font-size:12px;color:#8b8394;width:38px;text-align:right">'+r[2]+'</div></div>').join("")
  +'<div style="font-size:13px;color:#7a6a8c">Redemption choice is a signal.</div></div>'
  +'<div class="card" style="padding:15px 17px"><div class="hdr">Tiers</div>'
  +[["Joy Starter","0+","Welcome points"],["Joy Gold","1,000+","Early access · free pack"],["Joy Bliss","2,250+","Hampers · events"]]
    .map((x,i)=>'<div style="padding:12px 13px;border-radius:10px;margin-bottom:8px;background:'+(i===1?"#F7F3FD":"#fff")+';border:1px solid '+(i===1?"#DCC9EC":"#EFE9F5")+'"><div style="font-size:14px;font-weight:700">'+x[0]+' <span style="font-size:11px;font-weight:700;color:#96670A;background:#FDF3DC;border-radius:999px;padding:2px 8px;margin-left:4px">'+x[1]+'</span></div><div style="font-size:12.5px;color:#8b8394;margin-top:3px">'+x[2]+'</div></div>').join("")
  +'</div></div>';
}

  +'<div class="card" style="padding:15px 17px"><div class="hdr">Recipes</div>'

function exEnrol(){
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'
  +'<div class="card" style="padding:15px 17px"><div class="hdr">No sign-up</div>'
  +'<div style="font-size:13.5px;line-height:1.55;color:#332b3c">Membership is created from the WhatsApp profile. No form, no app, no password.</div>'
  +'<div style="margin-top:10px">'+chips(["0 extra taps","100 welcome pts"])+'</div></div>'
  +'<div class="card" style="padding:15px 17px"><div class="hdr">One wallet · 14 brands</div>'
  +'<div style="display:flex;flex-wrap:wrap;gap:5px">'+["Dairy Milk","Silk","Oreo","Bournvita","5 Star","Gems","Celebrations","Toblerone","&More"].map((b,i)=>'<span style="font-size:11px;font-weight:600;padding:5px 9px;border-radius:999px;background:'+chipBg(i)+'">'+b.replace(/&/g,"&amp;")+'</span>').join("")+'</div></div>'
  +'<div class="card" style="padding:15px 17px;grid-column:1 / -1"><div class="hdr">Last campaign</div>'

const STEPS=[
 {tab:"Home",hint:false,extra:exEnrol,
  t:"Auto-enrollment into Mondelez Joy Club",
  s:"Every verified sampler joins the moment their claim is confirmed · points, tier and sample history at <b>joy.cadbury.in</b>.",
  n:[["1","One program, 14 brands."],["2","Gold · 625 pts from Bliss."]]},
 {tab:"Home",hint:true,extra:exActs,
  t:"Participate &amp; earn · every activity is live",
  s:"Tap any activity · each one runs its real flow: photo upload, Amazon review, share sheet, receipt camera, flavour trial.",
  n:[["1","Points credit only after verification."],["2","Every action returns usable data."]]},
 {tab:"Rewards",hint:false,extra:exRewards,
  t:"Redeem · where points become repeat purchase",
  s:"Gift cards, vouchers and festive hampers. Redeem on the phone · options unlock with the balance.",
  n:[["1","Redemption choice is a signal."],["2","Starter → Gold → Bliss keeps them earning."]]},
 {tab:"Shop",hint:false,extra:exSurface,
  t:"Shop, recipes &amp; data control",
  s:"Re-purchase links, recipe content and one-tap consent controls · all in the same app.",
  n:[["1","Tab bar: Home · Shop · Rewards · Recipes · Profile."],["2","Re-purchase clicks are attributable per SKU."]]},
];

function draw(){
  document.getElementById("body").innerHTML =
    tab==="Home"?scrHome(): tab==="Shop"?scrShop(): tab==="Rewards"?scrRewards(): tab==="Recipes"?scrRecipes(): scrProfile();
  drawTabs();
  const old=document.getElementById("ovl"); if(old)old.remove();
  if(sheet){
    const d=document.createElement("div"); d.className="ovl"; d.id="ovl";
    d.innerHTML='<div class="sheet"><div class="sh-head"><div class="t">'+SHEETS[sheet.id].title+'</div><button class="x" onclick="close_()">✕</button></div>'+SHEETS[sheet.id].render(sheet)+'</div>';
    document.getElementById("scr").appendChild(d);
  }
}
const SUBS=[
 ["ugc",0],["ugc",1],["ugc",2],
 ["receipt",0],["receipt",1],["receipt",2],
 ["refer",0],["refer",1],["refer",2]
];
function preset(id){
 if(id==="ugc"){ if(sUgc===null)sUgc=0; if(!sCap)sCap="Joy in every bite 🍫 #MondelezJoyClub"; }
 if(id==="review"&&!sStars)sStars=5;
 if(id==="trial"&&sFlav===null)sFlav=0;
}
function show(){
  const raw=parseFloat(location.hash.slice(1)||"0")||0;
  const i=Math.min(Math.max(0,Math.floor(raw)),STEPS.length-1);
  const sub=Math.max(0,Math.round((raw-Math.floor(raw))*10));
  const s=STEPS[i];
  let wantSheet=null;
  if(i===1&&sub>0&&SUBS[sub-1]){
    const S=SUBS[sub-1]; preset(S[0]);
    if(S[1]>=2){ const a=ACTS.find(x=>x.id===S[0]); if(a)done[a.id]=true; }
    wantSheet={id:S[0],step:S[1]};
  }
  document.getElementById("head").innerHTML=s.t;
  document.getElementById("sub").innerHTML=s.s;
  document.getElementById("note").innerHTML=s.n.map(n=>'<div class="n"><span class="b">'+n[0]+'</span><span>'+n[1]+'</span></div>').join("");
  document.getElementById("extra").innerHTML=s.extra?s.extra():"";
  document.getElementById("hint").style.display=(s.hint&&!wantSheet)?"block":"none";
  tab=s.tab; sheet=wantSheet; clearTimeout(vTimer); vTimer=null; draw();
}
window.addEventListener("hashchange",show); show();
</script>
