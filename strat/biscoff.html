<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Enrollment 3 — Biscoff × Minions limited drop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="strat.css">
<style>
.tv{width:430px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.tvset{border-radius:14px;background:#111;padding:10px;box-shadow:0 18px 40px rgba(11,31,63,0.26)}
.tvscr{border-radius:9px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#0E0A1A}
.tvscr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tvscr .ipl{position:absolute;left:10px;top:10px;background:#E4A400;color:#2E1145;font-size:10px;font-weight:800;letter-spacing:1px;border-radius:5px;padding:4px 9px}
.tvscr .qrbox{position:absolute;right:12px;bottom:12px;background:#fff;border-radius:9px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 8px 20px rgba(0,0,0,0.4)}
.tvscr .qrbox .q{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:1.5px;width:62px;height:62px}
.tvscr .qrbox .q i{background:#111;border-radius:1px}
.tvscr .qrbox .cap{font-size:8px;font-weight:800;color:#4F2170;letter-spacing:0.5px}
.tvstand{width:120px;height:9px;background:#222;border-radius:0 0 7px 7px;margin:0 auto}
.counter{background:#fff;border:1px solid #E3E7EF;border-radius:14px;padding:13px 16px}
.counter .l{font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:#8A93A3;text-transform:uppercase}
.counter .row{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.counter .v{font-size:31px;font-weight:800;letter-spacing:-1.2px;color:#C0392B;line-height:1}
.counter .of{font-size:13px;font-weight:700;color:#8A93A3}
.counter .bar{height:8px;border-radius:4px;background:#F1F4F9;margin-top:9px;overflow:hidden}
.counter .bar i{display:block;height:100%;background:linear-gradient(90deg,#E4A400,#C0392B);border-radius:4px}
.frnds{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.frnds div{aspect-ratio:1;border-radius:999px;border:1.5px dashed #D8CFE8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#B7ADC8}
.frnds div.on{border-style:solid;border-color:#128C4A;background:#E9FBF0;color:#0E6E3B}
</style>
</head><body>
<div id="__asset-preload" style="display:none" aria-hidden="true"><img data-asset="../../mdlz/lite-fs-logo.png" src="../../mdlz/lite-fs-logo.png" alt="" /><img data-asset="../../mdlz/lite-mdlz-logo.png" src="../../mdlz/lite-mdlz-logo.png" alt="" /><img data-asset="../snapshot/acq-drops.png" src="../snapshot/acq-drops.png" alt="" /><img data-asset="../../mdlz/prod-biscoff.png" src="../../mdlz/prod-biscoff.png" alt="" /></div>
<script>
(function(){var MAP={};function build(){var box=document.getElementById("__asset-preload");if(!box)return;[].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){var k=im.getAttribute("data-asset"),v=im.getAttribute("src");if(v&&v!==k)MAP[k]=v;});}
function fixOne(el){var s=el.getAttribute("src")||"";if(MAP[s])el.setAttribute("src",MAP[s]);}
function sweep(root){if(!root||!root.querySelectorAll)return;if(root.tagName==="IMG")fixOne(root);[].forEach.call(root.querySelectorAll("img"),fixOne);}
build();sweep(document);new MutationObserver(function(m){for(var i=0;i<m.length;i++){if(m[i].type==="attributes"&&m[i].target.tagName==="IMG")fixOne(m[i].target);for(var j=0;j<m[i].addedNodes.length;j++)sweep(m[i].addedNodes[j]);}}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});})();
</script>
<template id="__bundler_thumbnail" data-bg-color="#C0392B">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#C0392B"/><g fill="none" stroke="#fff" stroke-width="16" opacity="0.9"><rect x="330" y="220" width="540" height="330" rx="20"/><rect x="700" y="400" width="120" height="120" rx="10" fill="#fff"/></g><text x="600" y="690" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">Biscoff × Minions drop</text></svg>
</template>
<div id="topbar">
  <img class="md" src="../../mdlz/lite-mdlz-logo.png" alt="Mondelez"/>
  <div class="t" id="bar-title"></div>
  <img class="fs" src="../../mdlz/lite-fs-logo.png" alt="FreeStand"/>
</div>
<div id="rail"></div>
<div id="stage"></div>
<div id="caption"><div class="tag" id="cap-tag"></div><div class="tt" id="cap-t"></div><div class="ss" id="cap-s"></div></div>
<script src="strat.js"></script>
<script>
const AC="#C0392B";
const QRC=[0,1,2,4,5,7,9,10,12,14,16,18,20,21,22,24];
function tvset(){
  return '<div class="tv"><div class="tvset"><div class="tvscr">'
  +'<img src="../snapshot/acq-drops.png" alt=""/>'
  +'<div class="ipl">IPL · LIVE · 2ND INNINGS</div>'
  +'<div class="qrbox"><div class="q">'+Array.from({length:25},(_,i)=>'<i style="background:'+(QRC.indexOf(i)>=0?"#111":"transparent")+'"></i>').join("")+'</div><div class="cap">SCAN TO CLAIM</div></div>'
  +'</div></div><div class="tvstand"></div>'
  +'<div class="counter"><div class="l">Drop inventory</div><div class="row"><span class="v">10,000</span><span class="of">packs only</span></div>'
  +'<div class="bar"><i style="width:100%"></i></div>'
  +'<div style="font-size:11.5px;color:#6B7280;font-weight:600;margin-top:7px">Biscoff × Minions limited edition · chocolate + biscuit</div></div></div>';
}
window.PAGE={
 title:"Enrollment 3 — Biscoff × Minions: IPL TV drop",
 accent:AC,
 steps:[
 {label:"QR on the TV ad",
  left:tvset,
  kick:"Step 1 · Broadcast",
  title:"A QR code on a live IPL ad break — 10,000 packs, that’s it",
  sub:"Scarcity does the work of a media budget: the drop is announced on the biggest screen in India and closes when it’s gone.",
  body:()=>'<div class="card">'+chk([["Broadcast → WhatsApp in one scan","The TV frame carries the QR; the phone completes the journey"],["Hard cap of 10,000 packs","Scarcity, not discount, is the incentive — and it makes the ad news"],["Second-screen behaviour is the norm","Viewers already have a phone in hand during an innings break"]],AC)+'</div>'
   +'<div class="card">'+kvs([["Placement","IPL live · innings break"],["Inventory","10,000 packs"],["Product","Biscoff × Minions LE"],["Gate","Share with 10 friends"]],2)+'</div>',
  cap:["STEP 01","QR on a live IPL ad — 10,000 packs only","Broadcast to WhatsApp in one scan"]},

 {label:"Scan → waitlist",
  left:()=>wa({name:"Lotus Biscoff India",sub:"Verified business · WhatsApp",msgs:[
    ["u","Scanned the IPL code 🏏"],
    ["b","You’re in the queue for the <b>Biscoff × Minions</b> limited drop 🍪\n\nPosition <b>#3,418</b> of 10,000"],
    ["b","One catch: the drop unlocks only when <b>10 friends</b> join through your link.<div class=\"prog-in-chat\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>3 of 10 joined"]]}),
  kick:"Step 2 · The gate",
  title:"You don’t buy in — you bring 10 friends in",
  sub:"The unlock condition turns every claimant into a distribution channel, and every friend into a consented profile.",
  body:()=>'<div class="card"><div class="hdr">Referral gate · 3 of 10 joined</div><div class="frnds">'
   +Array.from({length:10},(_,i)=>'<div class="'+(i<3?"on":"")+'">'+(i<3?"✓":(i+1))+'</div>').join("")+'</div>'
   +'<div style="font-size:12px;color:#6B7280;font-weight:600;margin-top:10px">Each friend joins the same WhatsApp thread and is profiled on entry.</div></div>'
   +'<div class="card">'+chk([["Viral coefficient, engineered","One claimant must deliver 10 opt-ins — media cost approaches zero"],["Waitlist position is public","Scarcity is visible, so sharing feels urgent, not spammy"],["Friends are profiled too","Every invite is a fresh consented record, not an anonymous click"]],AC)+'</div>',
  cap:["STEP 02","Unlock only after 10 friends join","Referral gate, not a purchase gate"]},

 {label:"Drop unlocked",
  left:()=>wa({name:"Lotus Biscoff India",sub:"online",msgs:[
    ["b","🎉 <b>Unlocked!</b> All 10 friends joined.<div class=\"prog-in-chat\">"+Array.from({length:10},()=>'<i class="on"></i>').join("")+"</div>"],
    ["b","Your <b>Biscoff × Minions</b> pack is reserved.<div class=\"card-in-chat\"><img src=\"../../mdlz/prod-biscoff.png\" alt=\"\"/></div>"],
    ["u","📍 Address shared"],
    ["b","Shipping today ✈️ <b>Tracking LB-10429</b>\nYou’re now a <b>Joy Club</b> member — first access to the next drop."]]}),
  kick:"Step 3 · Fulfilment",
  title:"Pack reserved, shipped, and membership granted",
  sub:"The scarcity moment converts into a permanent membership — and first-refusal rights on the next limited edition.",
  body:()=>'<div class="card">'+chk([["Inventory decrements live","Reservation is real — the counter is the same one ops sees"],["Address agent screens duplicates","Ten cousins at one address can’t drain the drop"],["Next-drop priority is the retention hook","Membership has an obvious, desirable benefit from day one"]],AC)+'</div>'
   +stat4([["10,000","packs allocated","sold out in 41 min",AC],["1 : 9.4","claimant to referrals","avg friends joined",AC],["93,600","new profiles","from 10k claims",AC],["₹11","effective CAC","per consented profile",AC]]),
  cap:["STEP 03","Unlocked, shipped, enrolled","10k packs → 93.6k profiles"]},

 {label:"FreeStand analytics",
  full:()=>console5("Analytics","Biscoff × Minions · IPL Limited Drop","20 Sept 2026 · IPL live · 41-minute window",
    k4([["Packs allocated","10,000","100% of inventory"],["Scans from TV","118,940","peak 4,210 / min"],["New profiles","93,600","9.4 per claimant"],["Effective CAC","₹11","vs ₹92 paid media"]])
    +'<div class="g2">'
    +pan("Scan volume through the innings break (per minute)",bars([["Ad break 1 · 0–5 min",4210,"#C0392B"],["6–15 min",3180,"#D75B48"],["16–25 min",2240,"#E48070"],["26–35 min",1360,"#F0A596"],["36–41 min",620,"#F6C6BC"]],4400))
    +pan("Referral depth",pie([{l:"Reached 10 friends",v:38,c:"#C0392B"},{l:"5–9 friends",v:34,c:"#E48070"},{l:"1–4 friends",v:21,c:"#E4A400"},{l:"Shared none",v:7,c:"#9AA3B2"}])
      +'<div style="height:10px"></div>'
      +pie([{l:"New to Mondelez",v:64,c:"#052762"},{l:"Existing Joy Club",v:36,c:"#4A8BD4"}]))
    +'</div>'
    +'<div class="g3">'
    +pan("Claim heat by city",geo([["Mumbai · 2,140",50,20],["Bengaluru · 1,880",68,66],["Delhi NCR · 1,610",26,28],["Hyderabad · 1,205",42,58]],"Claims by metro · IPL window"))
    +pan("Drop timeline",tbl(["Minute","Event","Packs left"],[["00:00","QR live on air","10,000"],["00:06","First unlock","9,412"],["00:18","50% gone","5,004"],["00:33","90% gone","1,008"],["00:41","Sold out","0"]]))
    +pan("Live drop stream",feed([["Unlock 10/10 · pack reserved","now"],["Scan from IPL feed · Mumbai","4s"],["Duplicate address blocked","17s"],["Friend #7 joined · Pune","29s"],["Unlock 10/10 · pack reserved","46s"],["Inventory: 0 left · closed","1m"]]))
    +'</div>'),
  cap:["ANALYTICS","Biscoff drop: scarcity, virality and CAC","Live in the FreeStand console"]},
]};
mountStrat();
</script>
</body></html>
