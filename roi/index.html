<script>
(function(){
  var MAP={};
  function build(){
    var box=document.getElementById("__asset-preload"); if(!box) return;
    [].forEach.call(box.querySelectorAll("img[data-asset]"),function(im){
      var k=im.getAttribute("data-asset"), v=im.getAttribute("src");
      if(v&&v!==k) MAP[k]=v;
    });
  }
  function fixOne(el){
    var s=el.getAttribute("src")||"";
    if(MAP[s]) el.setAttribute("src",MAP[s]);
  }
  function sweep(root){
    if(!root||!root.querySelectorAll) return;
    if(root.tagName==="IMG") fixOne(root);
    [].forEach.call(root.querySelectorAll("img"),fixOne);
  }
  build(); sweep(document);
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==="attributes"&&m.target.tagName==="IMG") fixOne(m.target);
      for(var j=0;j<m.addedNodes.length;j++) sweep(m.addedNodes[j]);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
})();
</script>

 let h='<div class="tlw"><div class="tl"><i style="width:'+(s===6?100:1.5)+'%"></i></div>';

 MK.forEach((x,i)=>{const lit=s===6||x.k==="acq";h+='<div class="mk '+(i%2?"up":"dn")+(lit?" on":"")+(x.k==="acq"?" acq":"")+(x.k===5?" fin":"")+'" style="left:'+tx(x.m)+'%"><div class="dot"></div><div class="lb">'+x.t+'<small>'+x.s+'</small></div></div>';});
 return h+'</div>';

function chart(){
 const W=550,H=170,base=H-6,step=W/24,bw=12,maxA=520,maxC=3120;let cum=0;const pts=[[0,base]];
 const bars=RC.map((r,i)=>{const x=(r[0]-.5)*step-bw/2,h=r[2]/maxA*96;return '<rect x="'+x.toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="3" fill="#0A49B7" opacity=".8" style="animation:fadeInUp .4s '+(i*.05)+'s both"><title>M'+r[0]+' · '+r[1]+' · ₹'+r[2]+'</title></rect>';}).join("");
 RC.forEach(r=>{cum+=r[2];pts.push([(r[0]-.5)*step,base-cum/maxC*(base-14)]);});
 const last=pts[pts.length-1];
 return '<div class="chw"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:170px;display:block;overflow:visible">'+bars
  +'<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(" ")+'" fill="none" stroke="#128C4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .2s ease-out forwards"/>'

}

function left(s){
